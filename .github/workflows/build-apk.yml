                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(fill);
                  drawable.setCornerRadius(dp(radius));
                  drawable.setStroke(dp(1.5f), stroke);
                  return drawable;
              }

              private TextView label(String value, int size, int color, boolean bold) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextColor(color);
                  view.setTextSize(size);
                  view.setGravity(Gravity.CENTER);
                  view.setTypeface(Typeface.DEFAULT, bold ? Typeface.BOLD : Typeface.NORMAL);
                  return view;
              }

              private void showHome() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(navy);

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setGravity(Gravity.CENTER_HORIZONTAL);
                  page.setPadding(dp(20), dp(14), dp(20), dp(22));
                  scroll.addView(page);

                  try {
                      ImageView logo = new ImageView(this);
                      logo.setImageBitmap(BitmapFactory.decodeStream(getAssets().open("app_icon.jpg")));
                      logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      LinearLayout.LayoutParams logoParams =
                          new LinearLayout.LayoutParams(dp(174), dp(174));
                      logoParams.gravity = Gravity.CENTER;
                      logoParams.bottomMargin = dp(5);
                      page.addView(logo, logoParams);
                  } catch (Exception ignored) { }

                  TextView title = label("JIVAN PAWAR", 30, gold, true);
                  page.addView(title, new LinearLayout.LayoutParams(-1, -2));

                  TextView subtitle = label("TRADER CONTROL CENTER", 19, Color.WHITE, true);
                  subtitle.setPadding(0, dp(2), 0, dp(7));
                  page.addView(subtitle);

                  TextView intro = label("YOUR PERSONAL TRADING DASHBOARD", 13, gold, true);
                  intro.setPadding(dp(8), dp(8), dp(8), dp(8));
                  intro.setBackground(shape(navy, gold, 24));
                  LinearLayout.LayoutParams introParams =
                      new LinearLayout.LayoutParams(-1, -2);
                  introParams.setMargins(dp(18), dp(8), dp(18), dp(22));
                  page.addView(intro, introParams);

                  addAction(page, "1. AWS TRADING STUDIO",
                      "Open Windows App (AWS EC2 Desktop)\nVS Code • Edit Code • Run Strategy", 0);
                  addAction(page, "2. CONNECT TO PANEL",
                      "Connect to your saved trading panel", 1);
                  addAction(page, "3. MY WEBSITE",
                      "Jivan Pawar Stock Market Academy", 2);
                  addAction(page, "4. EC2 INSTANCE CONTROL",
                      "Start • Stop • Reboot your AWS instance", 3);

                  TextView footer = label("TRADE SMART  •  GROW WEALTH  •  BUILD YOUR FUTURE",
                      11, gold, true);
                  footer.setPadding(0, dp(24), 0, dp(5));
                  page.addView(footer);

                  TextView signature = label("Jivan Pawar", 22, gold, false);
                  signature.setTypeface(Typeface.SERIF, Typeface.ITALIC);
                  page.addView(signature);
                  TextView role = label("Financial Advisor And Trader", 12, Color.LTGRAY, false);
                  page.addView(role);

                  setContentView(scroll);
              }

              private void addAction(LinearLayout parent, String heading, String detail, int action) {
                  LinearLayout cardLayout = new LinearLayout(this);
                  cardLayout.setOrientation(LinearLayout.HORIZONTAL);
                  cardLayout.setGravity(Gravity.CENTER_VERTICAL);
                  cardLayout.setPadding(dp(14), dp(15), dp(12), dp(15));
                  cardLayout.setBackground(shape(card, gold, 17));
                  cardLayout.setElevation(dp(4));

                  TextView icon = label(
                      action == 0 ? "⌘" : action == 1 ? "▥" : action == 2 ? "◎" : "☁",
                      31, gold, true);
                  cardLayout.addView(icon, new LinearLayout.LayoutParams(dp(52), dp(54)));

                  View divider = new View(this);
                  divider.setBackgroundColor(gold);
                  LinearLayout.LayoutParams dividerParams =
                      new LinearLayout.LayoutParams(dp(1), dp(52));
                  dividerParams.setMargins(dp(10), 0, dp(13), 0);
                  cardLayout.addView(divider, dividerParams);

                  LinearLayout words = new LinearLayout(this);
                  words.setOrientation(LinearLayout.VERTICAL);
                  words.setGravity(Gravity.CENTER_VERTICAL);
                  TextView headingView = label(heading, 16, gold, true);
                  headingView.setGravity(Gravity.START);
                  TextView detailView = label(detail, 12, Color.WHITE, false);
                  detailView.setGravity(Gravity.START);
                  detailView.setPadding(0, dp(5), 0, 0);
                  words.addView(headingView);
                  words.addView(detailView);
                  cardLayout.addView(words, new LinearLayout.LayoutParams(0, -2, 1));

                  TextView arrow = label("›", 34, gold, true);
                  cardLayout.addView(arrow, new LinearLayout.LayoutParams(dp(24), -2));

                  LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(-1, -2);
                  params.setMargins(0, dp(7), 0, dp(7));
                  parent.addView(cardLayout, params);

                  cardLayout.setOnClickListener(v -> {
                      if (action == 0) openWindowsApp();
                      else if (action == 1) openLink(PANEL_URL);
                      else if (action == 2) openLink(WEBSITE_URL);
                      else openLink(EC2_INSTANCE_URL);
                  });
              }

              private void openWindowsApp() {
                  try {
                      Intent launch = getPackageManager().getLaunchIntentForPackage(WINDOWS_APP_PACKAGE);
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(launch);
                      } else {
                          Toast.makeText(this,
                              "Windows App is not installed. Opening Google Play.",
                              Toast.LENGTH_LONG).show();
                          openLink(WINDOWS_APP_PLAY_URL);
                      }
                  } catch (Exception e) {
                      openLink(WINDOWS_APP_PLAY_URL);
                  }
              }

              private void openLink(String url) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                  } catch (Exception e) {
                      Toast.makeText(this, "Unable to open this link", Toast.LENGTH_LONG).show();
                  }
              }
          }
